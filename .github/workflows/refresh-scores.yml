name: Refresh popularity scores

# Daily: recompute public/data/image-scores-static.json from Neon download events
# (scripts/data-platform/generate-scores.mjs; rules in lib/popularity.js) and commit
# it if it changed. The push redeploys the site on Vercel, which re-sorts every grid —
# category, theme, platform, collection, hubs, related images, search, /most-popular.
#
# Runs at 06:47 UTC, 30 min after the 06:17 Sheets→Neon sync + bot flagging
# (sync-neon.yml), so it scores freshly synced, bot-filtered rows.
# NOT a Vercel cron (Hobby plan caps those) — GitHub Actions, same as sync-neon.
#
# Because this bot commits to main daily, `git pull --rebase` before pushing local work.

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: refresh-scores
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate scores from Neon
        run: npm run scores:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- public/data/image-scores-static.json; then
            echo "Scores unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/image-scores-static.json
          git commit -m "chore(scores): daily popularity refresh"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed after 3 attempts" && exit 1
