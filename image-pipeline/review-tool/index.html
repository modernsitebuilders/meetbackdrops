<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Batch Category Review — 2026-10-02</title>
<style>
  :root {
    --bg: #f5f5f5; --card: #ffffff; --ink: #111827; --muted: #6b7280;
    --border: #e5e7eb; --accent: #E0A82E; --accent-ink: #111827;
    --changed: #fef3c7; --changed-border: #d97706;
    --reject: #fee2e2; --reject-border: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff;
    padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .stats { font-size: 13px; color: #d1d5db; display: flex; gap: 14px; flex-wrap: wrap; }
  header .stats b { color: #fff; }
  header .spacer { flex: 1; }
  button#saveBtn {
    background: var(--accent); color: var(--accent-ink); border: none; font-weight: 700;
    padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button#saveBtn:active { transform: translateY(1px); }
  #saveStatus { font-size: 13px; color: #d1d5db; }
  .toolbar {
    display: flex; gap: 8px; padding: 10px 20px; background: #fff; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; position: sticky; top: 56px; z-index: 9;
  }
  .toolbar button {
    border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 12px;
    font-size: 12.5px; cursor: pointer; color: var(--ink);
  }
  .toolbar button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px; padding: 16px 20px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card.changed { border-color: var(--changed-border); background: var(--changed); }
  .card.rejected { border-color: var(--reject-border); background: var(--reject); opacity: 0.6; }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; background: #e5e7eb; cursor: zoom-in; }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card .title { font-size: 12.5px; font-weight: 600; line-height: 1.3; min-height: 32px; }
  .card .orig { font-size: 11px; color: var(--muted); }
  .card select {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    font-size: 12.5px; background: #fff; color: var(--ink);
  }
  .card .quickrow { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .card .quickrow button {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; color: var(--ink);
  }
  .card .quickrow button.picked { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .card .rejrow { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--reject-border); margin-top: 2px; }
  /* lightbox */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; z-index: 100; cursor: zoom-out;
  }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; }
</style>
</head>
<body>

<header>
  <h1>Batch Review — Oct 2 2026 (92 images)</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <span id="saveStatus"></span>
  <button id="saveBtn">Save corrections → corrections.json</button>
</header>

<div class="toolbar" id="toolbar"></div>

<div class="grid" id="grid"></div>

<div id="lightbox"><img id="lightboxImg"></div>

<script>
const CATEGORIES = [
  "bookshelves","wall-shelves","office-spaces","home-office","neutral-backgrounds",
  "living-rooms","kitchens","coffee-shops","art-galleries","urban-lofts",
  "gardens-patios","historic-spaces","nature-landscapes","libraries",
  "christmas-backgrounds","halloween-backgrounds","valentines-backgrounds",
  "easter-backgrounds","spring-backgrounds","summer-backgrounds",
  "fall-backgrounds","bokeh-backgrounds"
];
// The categories this batch was actually written for — surfaced as one-click buttons.
const QUICK = ["home-office","coffee-shops","libraries","bookshelves","wall-shelves",
               "halloween-backgrounds","neutral-backgrounds","office-spaces","fall-backgrounds"];

let DATA = [];
let filter = 'all';

function label(slug) {
  return slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

async function load() {
  const res = await fetch('/data.json');
  DATA = await res.json();
  render();
}

function stats() {
  const counts = {};
  let changed = 0, rejected = 0;
  DATA.forEach(d => {
    if (d.rejected) { rejected++; return; }
    counts[d.category] = (counts[d.category] || 0) + 1;
    if (d.category !== d.originalCategory) changed++;
  });
  const parts = Object.entries(counts).sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `${label(k)}: <b>${v}</b>`);
  document.getElementById('stats').innerHTML =
    parts.join(' &nbsp;·&nbsp; ') + ` &nbsp;·&nbsp; <b>${changed}</b> changed` +
    (rejected ? ` &nbsp;·&nbsp; <b>${rejected}</b> rejected` : '');
}

function renderToolbar() {
  const origCounts = {};
  DATA.forEach(d => origCounts[d.originalCategory] = (origCounts[d.originalCategory]||0)+1);
  const cats = Object.keys(origCounts).sort((a,b) => origCounts[b]-origCounts[a]);
  const tb = document.getElementById('toolbar');
  tb.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.textContent = `All (${DATA.length})`;
  allBtn.className = filter === 'all' ? 'active' : '';
  allBtn.onclick = () => { filter = 'all'; render(); };
  tb.appendChild(allBtn);
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = `${label(c)} (${origCounts[c]})`;
    b.className = filter === c ? 'active' : '';
    b.onclick = () => { filter = c; render(); };
    tb.appendChild(b);
  });
}

function card(d) {
  const div = document.createElement('div');
  div.className = 'card' + (d.category !== d.originalCategory ? ' changed' : '') + (d.rejected ? ' rejected' : '');

  const img = document.createElement('img');
  img.src = d.webpUrl;
  img.loading = 'lazy';
  img.onclick = () => {
    document.getElementById('lightboxImg').src = d.webpUrl;
    document.getElementById('lightbox').style.display = 'flex';
  };
  div.appendChild(img);

  const body = document.createElement('div');
  body.className = 'body';

  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = d.title.replace(' | MeetBackdrops', '');
  body.appendChild(title);

  const orig = document.createElement('div');
  orig.className = 'orig';
  orig.textContent = 'pipeline guessed: ' + label(d.originalCategory);
  body.appendChild(orig);

  const quickrow = document.createElement('div');
  quickrow.className = 'quickrow';
  QUICK.forEach(c => {
    const b = document.createElement('button');
    b.textContent = label(c);
    if (c === d.category) b.classList.add('picked');
    b.onclick = () => { d.category = c; render(); };
    quickrow.appendChild(b);
  });
  body.appendChild(quickrow);

  const select = document.createElement('select');
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = label(c);
    if (c === d.category) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = () => { d.category = select.value; render(); };
  body.appendChild(select);

  const rejrow = document.createElement('label');
  rejrow.className = 'rejrow';
  rejrow.innerHTML = `<input type="checkbox" ${d.rejected ? 'checked' : ''}> discard this image (don't add to site)`;
  rejrow.querySelector('input').onchange = (e) => { d.rejected = e.target.checked; render(); };
  body.appendChild(rejrow);

  div.appendChild(body);
  return div;
}

function render() {
  renderToolbar();
  stats();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.filter(d => filter === 'all' || d.originalCategory === filter)
      .forEach(d => grid.appendChild(card(d)));
}

document.getElementById('lightbox').onclick = () => {
  document.getElementById('lightbox').style.display = 'none';
};

document.getElementById('saveBtn').onclick = async () => {
  const status = document.getElementById('saveStatus');
  status.textContent = 'saving…';
  const res = await fetch('/save', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(DATA.map(({slug, category, originalCategory, rejected}) =>
      ({slug, category, originalCategory, rejected: !!rejected})))
  });
  if (res.ok) {
    status.textContent = '✓ saved — tell Claude you\'re done';
  } else {
    status.textContent = '✗ save failed';
  }
};

load();
</script>
</body>
</html>
