<!doctype html>
<html lang="en">
<head>

<title>November batch Queue</title>
<style>
  :root { --bg:#F5F5F5; --card:#fff; --ink:#111827; --muted:#6b7280; --gold:#E0A82E; --done:#d1d5db; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --ink:#f3f4f6; --muted:#9ca3af; --done:#374151; --line:#2a2e36; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:20px; }
  .bar i { display:block; height:100%; background:var(--gold); transition:width .2s; }
  .next { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:24px; }
  .next .meta { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .next pre { white-space:pre-wrap; word-break:break-word; margin:0 0 16px; font:13px/1.5 ui-monospace, Menlo, monospace; max-height:180px; overflow:auto; }
  button.big { width:100%; padding:16px; font-size:17px; font-weight:600; border:0; border-radius:10px; background:var(--gold); color:#111827; cursor:pointer; }
  button.big:active { transform:translateY(1px); }
  .toast { color:var(--muted); font-size:13px; margin-top:10px; min-height:20px; text-align:center; }
  ol { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:10px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  li.done span.t { color:var(--muted); text-decoration:line-through; }
  li.cur { font-weight:600; }
  li span.t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li button { font-size:12px; padding:4px 8px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; cursor:pointer; }
  .reset { margin-top:16px; background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; }
</style>
</head>
<body>

  <p class="sub">Ordered by urgency: fall, home office, winter, bookshelves, libraries. Click the button, switch to Midjourney, paste, press Enter. Repeat. Each paste is 4 jobs (Fast mode).</p>
  <div class="bar"><i id="bar"></i></div>
  <div class="next">
    <div class="meta" id="meta"></div>
    <pre id="preview"></pre>
    <button class="big" id="copy">Copy next prompt</button>
    <div class="toast" id="toast"></div>
  </div>
  <ol id="list"></ol>
  <button class="reset" id="reset">Reset progress</button>

const KEY = 'mb-rest-2026-11-done';
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };
const nextIdx = () => PROMPTS.findIndex((_, i) => !done.has(i));

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy'); ta.remove(); return ok;
}

function render() {
  const n = nextIdx();
  document.getElementById('bar').style.width = (done.size / PROMPTS.length * 100) + '%';
  const meta = document.getElementById('meta'), pre = document.getElementById('preview'), btn = document.getElementById('copy');
  if (n === -1) { meta.textContent = `All ${PROMPTS.length} pastes done.`; pre.textContent = ''; btn.disabled = true; btn.textContent = 'Done'; }
  else { meta.textContent = `Next: ${n + 1} of ${PROMPTS.length} · ${PROMPTS[n].section} · ${PROMPTS[n].style} · ${PROMPTS[n].n} jobs`; pre.textContent = PROMPTS[n].text; btn.disabled = false; btn.textContent = 'Copy next prompt'; }
  const ol = document.getElementById('list'); ol.innerHTML = '';
  PROMPTS.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = (done.has(i) ? 'done' : '') + (i === n ? ' cur' : '');
    li.innerHTML = `<span>${i + 1}.</span><span class="t"></span><button>${done.has(i) ? 'Undo' : 'Copy'}</button>`;
    li.querySelector('.t').textContent = `${p.section} · ${p.style} · ${p.text}`;
    li.querySelector('button').onclick = async () => {
      if (done.has(i)) done.delete(i); else { await copyText(p.text); done.add(i); flash(`Copied ${i + 1}.`); }
      save(); render();
    };
    ol.appendChild(li);
  });
}
function flash(m) { const t = document.getElementById('toast'); t.textContent = m; clearTimeout(flash.h); flash.h = setTimeout(() => t.textContent = '', 2500); }

document.getElementById('copy').onclick = async () => {
  const n = nextIdx(); if (n === -1) return;
  const ok = await copyText(PROMPTS[n].text);
  if (!ok) { flash('Copy failed. Select the text above and copy it manually.'); return; }
  done.add(n); save(); render(); flash(`Copied ${n + 1}. Paste it into Midjourney.`);
};
document.getElementById('reset').onclick = () => { if (confirm('Reset all progress?')) { done.clear(); save(); render(); } };
render();
</script>
